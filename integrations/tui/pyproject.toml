[project]
name = "sos-tui"
version = "0.1.0"
description = "Textual terminal interface for sloporsane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual",
]

[project.scripts]
tui = "sos_tui.app:main"

[dependency-groups]
build = ["pyinstaller>=6.16,<7"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sos_tui"]
artifacts = ["src/sos_tui/bin/sosd"]
infer_tag = true
